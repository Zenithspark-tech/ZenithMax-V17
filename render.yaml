services:
  - type: web
    name: zenithmax-v17-1-free
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      # Optional Pexels discovery. Add PEXELS_API_KEY in Render Environment.
      # - key: PEXELS_API_KEY
      # Optional server-side AI provider. Use an OpenAI-compatible endpoint.
      # - key: AI_API_URL
      # - key: AI_API_KEY
      # - key: AI_MODEL
