name: Install ZenithMax V17.1 Free Render

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-free-v17:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Free Render V17.1
        run: |
          rm -rf /tmp/zenithmax-free
          mkdir -p /tmp/zenithmax-free

          unzip -q ZenithMax_V17_1_Free_Render.zip -d /tmp/zenithmax-free

          ROOT="$(find /tmp/zenithmax-free -maxdepth 3 -type f -name 'render.yaml' -print -quit | xargs -r dirname)"

          if [ -z "$ROOT" ]; then
            echo "ERROR: Could not find render.yaml in the V17.1 package."
            exit 1
          fi

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            -exec rm -rf {} +

          cp -a "$ROOT/." .

          rm -f ZenithMax_V17_1_Free_Render.zip

      - name: Commit Free Render V17.1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Install ZenithMax V17.1 Free Render" || echo "No changes to commit"
          git push
